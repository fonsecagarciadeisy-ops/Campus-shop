<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusShop - Mi Carrito</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header class="top-header inner-header">
        <a href="index.html" class="back-btn" aria-label="Volver atrás">
            <img class="imagen" src="img/back-icon.svg" alt="Volver">
        </a>
        <h1 class="page-title">Mi Carrito (3)</h1>
        <div style="width: 24px;"></div> <!-- Espaciador para centrar el título -->
    </header>

    <main class="cart-page">
        <!-- Lista de Productos -->
        <section class="cart-list">

            <article class="cart-item">
                <img src="img/Camiseta basica.webp" alt="camiseta basica Blanca" class="imagen-producto">
                <div class="cart-item-details">
                    <div class="cart-item-header">
                        <h3>Camiseta Basica Blanca</h3>
                        <button class="delete-btn" aria-label="Eliminar producto">
                            <img src="img/trash-icon.svg" alt="Eliminar">
                        </button>
                    </div>
                    <span class="sku">Ref: #SKU12345</span>
                    <div class="cart-item-footer">
                        <div class="quantity-selector">
                            <button type="button">-</button>
                            <span>1</span>
                            <button type="button">+</button>
                        </div>
                        <div class="price-box">
                            <span class="price">$22.000</span>
                            <small>subtotal</small>
                        </div>
                    </div>
                </div>
            </article>

            <article class="cart-item">
                <img src="img/sudadera gris.webp" alt="Sudadera Capucha Gris" class="imagen-producto">
                <div class="cart-item-details">
                    <div class="cart-item-header">
                        <h3>Sudadera Capucha Gris</h3>
                        <button class="delete-btn" aria-label="Eliminar producto">
                            <img src="img/trash-icon.svg" alt="Eliminar">
                        </button>
                    </div>
                    <span class="sku">Ref: #SKU67890</span>
                    <div class="cart-item-footer">
                        <div class="quantity-selector">
                            <button type="button">-</button>
                            <span>1</span>
                            <button type="button">+</button>
                        </div>
                        <div class="price-box">
                            <span class="price">$45.000</span>
                            <small>subtotal</small>
                        </div>
                    </div>
                </div>
            </article>

            <article class="cart-item">
                <img src="img/pantalon Jogger.webp" alt="Pantalón Jogger Urbano"
                    class="imagen-producto">
                <div class="cart-item-details">
                    <div class="cart-item-header">
                        <h3>Pantalón Jogger Urbano</h3>
                        <button class="delete-btn" aria-label="Eliminar producto">
                            <img src="img/trash-icon.svg" alt="Eliminar">
                        </button>
                    </div>
                    <span class="sku">Ref: #SKU11223</span>
                    <div class="cart-item-footer">
                        <div class="quantity-selector">
                            <button type="button">-</button>
                            <span>1</span>
                            <button type="button">+</button>
                        </div>
                        <div class="price-box">
                            <span class="price">$38.000</span>
                            <small>subtotal</small>
                        </div>
                    </div>
                </div>
            </article>

        </section>

        <!-- Resumen de Pedido -->
        <section class="cart-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <span>$105.000</span>
            </div>
            <div class="summary-row">
                <span>Impuestos</span>
                <span>$19.950</span>
            </div>
            <hr class="summary-divider">
            <div class="summary-row total-row">
                <span>Total</span>
                <span>$124.950</span>
            </div>

            <a href="checkout.html" class="btn-primary">Proceder al Pago</a>
        </section>
    </main>

</body>

</html>
