<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Julián Monsalve">
    <title>CampusShop - Inicio</title>

    <!-- Enlace a los archivos CSS modulares en orden de cascada -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- 1. ENCABEZADO SUPERIOR -->
    <header class="top-header">
        <!-- Botón de menú hamburguesa -->
        <button class="menu-btn" aria-label="Abrir menú">
            <img src="img/menu-icon.svg" alt="Menú">
        </button>

        <!-- Logo / Título central -->
        <h1 class="logo">CampusShop</h1>

        <!-- Icono del carrito con el badge numérico -->
        <a href="carrito.html" class="cart-icon" aria-label="Ir al carrito">
            <img src="img/cart-icon.svg" alt="Carrito">
            <span class="cart-badge">3</span>
        </a>
    </header>

    <!-- 2. CONTENIDO PRINCIPAL -->
    <main>

        <!-- Sección de Búsqueda -->
        <section class="search-section">
            <div class="search-bar">
                <img src="img/search-icon.svg" alt="Buscar">
                <input type="search" placeholder="Buscar productos, marcas...">
            </div>
        </section>

        <!-- Sección de Categorías Populares -->
        <section class="categories-section">
            <h2>Categorías Populares</h2>
            <div class="categories-container">
                <!-- Aquí irán los botones cuadrados de categorías (Abrigos, Camisetas, etc.) -->
            </div>
        </section>

        <!-- Sección de Novedades (Catálogo destacado) -->
        <section class="products-section">
            <h2>Novedades para ti</h2>
            <div class="products-grid">
                <!-- Cada producto debe ser un <article> como este: -->
                <article class="product-card">
                    <!-- Imagen, botón de favorito, título, precio -->
                </article>

                <!-- Más <article> aquí... -->
            </div>
        </section>

    </main>

    <!-- 3. NAVEGACIÓN INFERIOR (Bottom Nav) -->
    <nav class="bottom-nav">
        <ul>
            <li>
                <a href="index.html" class="active">
                    <img src="img/home-icon.svg" alt="Inicio">
                    <span>Inicio</span>
                </a>
            </li>
            <li>
                <a href="catalogo.html">
                    <img src="img/categories-icon.svg" alt="Categorías">
                    <span>Categorías</span>
                </a>
            </li>
            <!-- Agrega los demás enlaces (Carrito, Pedidos, Perfil) siguiendo este patrón -->
        </ul>
    </nav>

</body>

</html>
