<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusShop - Carrito Vacío</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="contenedor-app">
        <header class="encabezado-superior encabezado-secundario">
            <a href="index.html" class="boton-volver" aria-label="Volver a Inicio">←</a>
            <h1 class="titulo-pantalla">Mi Carrito</h1>
            <div class="espaciador-encabezado"></div>
        </header>

        <main>
            <section class="estado-vacio">
                <div class="icono-estado-vacio">🛍️</div>
                <h2 class="titulo-estado-vacio">Tu carrito está vacío</h2>
                <p class="descripcion-estado-vacio">
                    Aún no has agregado prendas de vestir a tu compra. ¡Revisa nuestra colección de ropa y viste los colores de Campus!
                </p>
                <a href="catalogo.html" class="boton-primario">Explorar Catálogo de Ropa</a>
            </section>
        </main>

        <nav class="navegacion-inferior">
            <ul class="lista-navegacion-inferior">
                <li>
                    <a href="index.html" class="enlace-navegacion">
                        <span class="icono-navegacion">🏠</span>
                        <span class="texto-navegacion">Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="catalogo.html" class="enlace-navegacion">
                        <span class="icono-navegacion">🏷️</span>
                        <span class="texto-navegacion">Catálogo</span>
                    </a>
                </li>
                <li>
                    <a href="vacio.html" class="enlace-navegacion activo">
                        <span class="icono-navegacion">🛒</span>
                        <span class="texto-navegacion">Carrito</span>
                    </a>
                </li>
                <li>
                    <a href="historial.html" class="enlace-navegacion">
                        <span class="icono-navegacion">📦</span>
                        <span class="texto-navegacion">Pedidos</span>
                    </a>
                </li>
                <li>
                    <a href="perfil.html" class="enlace-navegacion">
                        <span class="icono-navegacion">👤</span>
                        <span class="texto-navegacion">Perfil</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
